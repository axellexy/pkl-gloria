<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Jurnal PKL</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --bg-body: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius-xl: 24px;
            --radius-lg: 16px;
            --shadow-lg: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }

        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.2) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .login-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        /* ganti isi div ini jika ingin mengubah logo dengan <img> */
        .brand-icon {
    width: 56px;
    height: 56px;
    background: transparent; /* Hilangkan background gradient ungu */
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    overflow: hidden;
    box-shadow: none; /* Hilangkan shadow bawaan jika gambar sudah punya bentuk sendiri */
}

.brand-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* Agar rasio gambar PNG tetap presisi dan tidak gepeng */
}

        .brand-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Tab Switcher Style */
        .auth-tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .field input, .field select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            font-size: 0.9rem;
            color: white;
            outline: none;
            transition: all 0.2s;
        }

        .field input:focus, .field select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .field select option {
            background: #1e293b;
            color: white;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius-lg);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .msg-box {
            font-size: 0.8rem;
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 14px;
            text-align: center;
            display: none;
            font-weight: 600;
        }

        .msg-box.error {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .msg-box.success {
            background: rgba(22, 163, 74, 0.15);
            border: 1px solid #22c55e;
            color: #86efac;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon">
    <img src="logo.png" alt="Logo Jurnal PKL">
            </div>
            <h1>Jurnal PKL Gloria</h1>
            <p>Sistem Presensi & Jurnal Masuk Siswa</p>
        </div>

        <!-- TAB NAVIGASI -->
        <div class="auth-tabs">
            <button type="button" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button type="button" class="tab-btn" onclick="switchTab('register')">Daftar Akun</button>
        </div>

        <!-- FORM LOGIN -->
        <form id="form-login">
            <div class="field">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="Masukkan username..." required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <!-- FORM REGISTER -->
        <form id="form-register" style="display: none;">
            <div class="field">
                <label>Pilih Nama Anggota</label>
                <select id="reg-nama" required>
                    <option value="" disabled selected>-- Pilih Nama Anda --</option>
                    <option value="Achmad Darell Yusuf">Achmad Darell Yusuf</option>
                    <option value="Ardan Fahriza">Ardan Fahriza</option>
                    <option value="Firmansyah">Firmansyah</option>
                    <option value="Muhammad Azzam Irransyah">Muhammad Azzam Irransyah</option>
                    <option value="Revan Aufa Hilal Kamil">Revan Aufa Hilal Kamil</option>
                </select>
            </div>

            <div class="field">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Contoh: darell" required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Minimal 6 karakter" required minlength="6">
            </div>

            <button type="submit" id="btn-reg-submit" class="btn-submit">Buat Akun Baru</button>
        </form>

        <div id="msg-box" class="msg-box"></div>

        <div class="footer-note">
            &copy; 2026 Enterprise Portal PKL. All rights reserved.
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://rkarsceacmamrzwryczj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_vd9qmhC_6UNRPjeuTkE9Jg_UlYmLiPv"; 

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Redirect jika sudah terautentikasi
    if (localStorage.getItem('user_email')) {
        window.location.href = "index.html";
    }

    // Switch Tab Login & Register
    function switchTab(type) {
        const loginForm = document.getElementById('form-login');
        const regForm = document.getElementById('form-register');
        const tabs = document.querySelectorAll('.tab-btn');
        hideMsg();

        if (type === 'login') {
            loginForm.style.display = 'block';
            regForm.style.display = 'none';
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            regForm.style.display = 'block';
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
        }
    }

    function formatUsernameToEmail(username) {
        const cleanUsername = username.trim().toLowerCase().replace(/\s+/g, '');
        return `${cleanUsername}@jurnalpkl.local`;
    }

    // PROCESS LOGIN
    document.getElementById('form-login').addEventListener('submit', async function(e) {
        e.preventDefault();
        showMsg("Sedang memproses login...", "success");

        const usernameInput = document.getElementById('login-username').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value;
        const email = formatUsernameToEmail(usernameInput);

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            showMsg("Login gagal: Username atau password salah.", "error");
        } else {
            let userNama = data.user.user_metadata?.full_name || usernameInput;
            
            if (usernameInput === 'admin' || usernameInput === 'pembimbing') {
                userNama = "Admin / Pembimbing (Viewer)";
            }

            localStorage.setItem('user_email', data.user.email);
            localStorage.setItem('user_nama', userNama);
            localStorage.setItem('user_role', (usernameInput === 'admin' || usernameInput === 'pembimbing') ? 'viewer' : 'user');
            
            window.location.href = "index.html";
        }
    });

    // PROCESS REGISTER
    document.getElementById('form-register').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const nama = document.getElementById('reg-nama').value;
        const usernameInput = document.getElementById('reg-username').value.trim().toLowerCase();
        const password = document.getElementById('reg-password').value;
        const email = formatUsernameToEmail(usernameInput);
        const btnReg = document.getElementById('btn-reg-submit');

        if (usernameInput === 'admin' || usernameInput === 'pembimbing') {
            showMsg("Username 'admin' atau 'pembimbing' tidak bisa didaftarkan secara umum.", "error");
            return;
        }

        showMsg("Memeriksa ketersediaan nama...", "success");
        btnReg.disabled = true;

        try {
            const { data: existingUser } = await supabaseClient
                .from('profiles')
                .select('full_name')
                .eq('full_name', nama)
                .maybeSingle();

            if (existingUser) {
                showMsg(`⚠️ Nama "${nama}" sudah terdaftar! 1 Anggota hanya boleh punya 1 akun.`, "error");
                btnReg.disabled = false;
                return;
            }

            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: { data: { full_name: nama } }
            });

            if (authError) {
                showMsg("Gagal daftar: " + authError.message, "error");
                btnReg.disabled = false;
                return;
            }

            if (authData.user) {
                await supabaseClient.from('profiles').insert([
                    { id: authData.user.id, full_name: nama }
                ]);
            }

            showMsg("Akun berhasil dibuat! Silakan klik tab Login untuk masuk.", "success");
            document.getElementById('form-register').reset();

        } catch (err) {
            console.error(err);
            showMsg("Terjadi kesalahan sistem.", "error");
        } finally {
            btnReg.disabled = false;
        }
    });

    function showMsg(text, type) {
        const msgBox = document.getElementById('msg-box');
        msgBox.innerText = text;
        msgBox.className = `msg-box ${type}`;
        msgBox.style.display = 'block';
    }

    function hideMsg() {
        const msgBox = document.getElementById('msg-box');
        msgBox.style.display = 'none';
    }
</script>

</body>
</html>
